<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Plus Jakarta Sans";
          font-weight: 500;
          src: url("assets/fonts/plus-jakarta-sans-500.woff2") format("woff2");
        }
        @font-face {
          font-family: "Plus Jakarta Sans";
          font-weight: 700;
          src: url("assets/fonts/plus-jakarta-sans-700.woff2") format("woff2");
        }
        @font-face {
          font-family: "JetBrains Mono";
          font-weight: 700;
          src: url("assets/fonts/jetbrains-mono-700.woff2") format("woff2");
        }
        * {
          box-sizing: border-box;
        }
        #root {
          position: absolute;
          inset: 0;
          padding: 96px 120px;
          display: grid;
          grid-template-columns: 1.15fr 0.85fr;
          gap: 64px;
          align-items: center;
          background: #f8f9fa;
          color: #1a1c1e;
          font-family: "Plus Jakarta Sans", sans-serif;
        }
        .kicker {
          font-family: "JetBrains Mono", monospace;
          font-size: 20px;
          font-weight: 700;
          letter-spacing: 0.12em;
          color: #0b57d0;
          text-transform: uppercase;
        }
        h1 {
          margin: 18px 0 24px;
          font-size: 76px;
          font-weight: 700;
          line-height: 1.05;
          letter-spacing: -0.02em;
        }
        .card {
          background: #ffffff;
          border: 1.5px solid #dadce0;
          border-radius: 24px;
          padding: 28px;
        }
      </style>
      <div id="root">
        <div>
          <div id="kicker" class="kicker">DAILY BRIEFING</div>
          <h1 id="headline">Headline Here</h1>
        </div>
        <div id="panel" class="card">Data Visualization / SVG Chart</div>
        <script>
          ;(function () {
            const tl = gsap.timeline({ paused: true })
            tl.fromTo(
              "#kicker",
              { opacity: 0, y: 12 },
              { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
              0.1
            )
            tl.fromTo(
              "#headline",
              { opacity: 0, y: 20 },
              { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
              0.25
            )
            tl.fromTo(
              "#panel",
              { opacity: 0, x: 24 },
              { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
              0.45
            )
            window.__timelines["scene-01"] = tl
          })()
        </script>
      </div>
    </template>
  </body>
</html>
